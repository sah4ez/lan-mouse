name: Multi-platform Build

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Validate syntax and run tests on current platform
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: rustfmt, clippy
      
      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Check formatting
        run: cargo fmt --check
      
      - name: Check syntax (no default features)
        run: cargo check --no-default-features --all-targets
      
      - name: Run tests (no default features)
        run: cargo test --no-default-features --lib
      
      - name: Clippy (no default features)
        run: cargo clippy --no-default-features --all-targets -- -D warnings

  # Build for Linux AMD64
  build-linux-amd64:
    name: Build Linux AMD64
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          target: x86_64-unknown-linux-gnu
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev
      
      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build (no default features)
        run: cargo build --no-default-features --release --target x86_64-unknown-linux-gnu
      
      - name: Build (with x11 feature)
        run: cargo build --no-default-features --release --target x86_64-unknown-linux-gnu --features x11_capture,x11_emulation
      
      - name: Verify binary
        run: |
          if [ ! -f target/x86_64-unknown-linux-gnu/release/lan-mouse ]; then
            echo "Binary not found!"
            exit 1
          fi
          file target/x86_64-unknown-linux-gnu/release/lan-mouse
          ls -lh target/x86_64-unknown-linux-gnu/release/lan-mouse
      
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: lan-mouse-linux-amd64
          path: target/x86_64-unknown-linux-gnu/release/lan-mouse
          retention-days: 7

  # Build for Linux ARM64
  build-linux-arm64:
    name: Build Linux ARM64
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          target: aarch64-unknown-linux-gnu
      
      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      
      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build (no default features)
        run: cargo build --no-default-features --release --target aarch64-unknown-linux-gnu
      
      - name: Verify binary
        run: |
          if [ ! -f target/aarch64-unknown-linux-gnu/release/lan-mouse ]; then
            echo "Binary not found!"
            exit 1
          fi
          file target/aarch64-unknown-linux-gnu/release/lan-mouse
          ls -lh target/aarch64-unknown-linux-gnu/release/lan-mouse
      
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: lan-mouse-linux-arm64
          path: target/aarch64-unknown-linux-gnu/release/lan-mouse
          retention-days: 7

  # Build for macOS Apple Silicon
  build-macos-arm64:
    name: Build macOS Apple Silicon
    runs-on: macos-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          target: aarch64-apple-darwin
      
      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build (no default features)
        run: cargo build --no-default-features --release --target aarch64-apple-darwin
      
      - name: Verify binary
        run: |
          if [ ! -f target/aarch64-apple-darwin/release/lan-mouse ]; then
            echo "Binary not found!"
            exit 1
          fi
          file target/aarch64-apple-darwin/release/lan-mouse
          ls -lh target/aarch64-apple-darwin/release/lan-mouse
      
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: lan-mouse-macos-arm64
          path: target/aarch64-apple-darwin/release/lan-mouse
          retention-days: 7

  # Build for macOS Intel
  build-macos-intel:
    name: Build macOS Intel
    runs-on: macos-15-intel
    needs: validate
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          target: x86_64-apple-darwin
      
      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build (no default features)
        run: cargo build --no-default-features --release --target x86_64-apple-darwin
      
      - name: Verify binary
        run: |
          if [ ! -f target/x86_64-apple-darwin/release/lan-mouse ]; then
            echo "Binary not found!"
            exit 1
          fi
          file target/x86_64-apple-darwin/release/lan-mouse
          ls -lh target/x86_64-apple-darwin/release/lan-mouse
      
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: lan-mouse-macos-intel
          path: target/x86_64-apple-darwin/release/lan-mouse
          retention-days: 7

  # Summary
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-linux-amd64, build-linux-arm64, build-macos-arm64, build-macos-intel]
    if: always()
    steps:
      - name: Check build status
        run: |
          echo "Build Summary:"
          echo "================"
          echo "Linux AMD64: ${{ needs.build-linux-amd64.result }}"
          echo "Linux ARM64: ${{ needs.build-linux-arm64.result }}"
          echo "macOS ARM64: ${{ needs.build-macos-arm64.result }}"
          echo "macOS Intel: ${{ needs.build-macos-intel.result }}"
          
          if [ "${{ needs.build-linux-amd64.result }}" != "success" ] || \
             [ "${{ needs.build-linux-arm64.result }}" != "success" ] || \
             [ "${{ needs.build-macos-arm64.result }}" != "success" ] || \
             [ "${{ needs.build-macos-intel.result }}" != "success" ]; then
            echo ""
            echo "Some builds failed!"
            exit 1
          fi
          
          echo ""
          echo "All builds completed successfully!"
